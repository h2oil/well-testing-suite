name: Server release (accounts API — server-v* tags only)

# docs/ACCOUNTS-PLAN.md §13.8 / D19 (WP-OPS). The functions-only site in server/ is released ONLY from a server-v* tag on a
# master commit, never by an ordinary push (the static site keeps auto-deploying from master as before). The workflow is
# inert until the owner adds the secrets and variables below (server/RUNBOOK.md, "Activation checklist"):
#   environment server-production (required reviewer = the owner): secret WTS_DEPLOY_TOKEN, variables WTS_DEPLOY_SITE,
#     WTS_DEPLOY_COMMAND (the host CLI deploy invocation, run inside <runner temp>/rel/server — the bundle placed in a
#     repository layout, so a host whose site settings name the base directory `server` finds it — with the pinned CLI of
#     server/ci/deploy-cli on PATH; the token reaches the CLI through its environment, never its command line) and
#     optionally WTS_HEALTH_URL
# Migrations: the hosting platform applies the generated folder server/<platform>/database/migrations itself at the production
# deploy (server/README.md "Platform migrations"); this workflow never opens a database connection and holds no database
# credential. The verify job checks, read-only, that the generated folder equals what server/db/platform-migrations.js
# --write produces from server/db/migrations and that no file already released under a previous server tag changed or
# disappeared; the deploy job refuses unless that check said in-sync (new code never goes live without its migrations).
# Without the secrets the verify job still runs (tests, secret scan, publish check, migrations check, account-block digest,
# bundle) and the deploy steps print a notice and skip. The secrets must be ENVIRONMENT secrets of server-production, which
# must exist with the owner as required reviewer before the first tag (repository-level secrets or an auto-created
# environment would skip the manual approval; server/RUNBOOK.md §3 step 8).
# The request handlers' own secrets (master keys, peppers, provider secrets …) live
# only in the functions site's environment and never pass through this workflow.

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.checklist.outputs.migrations_changed }}
      platform_migrations: ${{ steps.pmig.outputs.platform_migrations }}
    steps:
      - name: Checkout (full history, for the master check and the pin diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag format and master ancestry
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^server-v[0-9]+(\.[0-9]+){0,2}$ ]]; then echo "::error::tag must be server-vN[.N[.N]]"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then echo "::error::the tagged commit is not on master"; exit 1; fi

      - name: Install server dependencies (pinned lockfile)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Server tests (throwaway local database cluster)
        working-directory: server
        env:
          WTS_TEST_DB_PORT: '54010'
        run: node test/run.js

      - name: Secret scan
        run: node server/ci/secret-scan.js

      - name: Publish allow-list check
        run: node prism-build/publish-site.js --check

      - name: Platform migrations in sync, released files unchanged (read-only; no database connection)
        id: pmig
        run: |
          node server/db/platform-migrations.js --check
          dir=$(node -e "process.stdout.write(require('path').relative(process.cwd(), require('./server/db/platform-migrations').OUT))")
          prev=$(git describe --tags --abbrev=0 --match 'server-v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            bad=$(git diff --name-only --diff-filter=MDR "$prev" "$GITHUB_SHA" -- "$dir")
            if [ -n "$bad" ]; then echo "::error::platform migrations released under $prev changed or were removed: $bad"; exit 1; fi
          fi
          echo "platform_migrations=in-sync" >> "$GITHUB_OUTPUT"

      - name: Account block digest and pinned-file changes (for the owner's release checklist)
        id: checklist
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'server-v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" "$GITHUB_SHA" -- server/db/migrations; then changed=false; else changed=true; fi
          echo "migrations_changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### Release checklist inputs for $GITHUB_REF_NAME"
            node prism-build/acct-hash.js --release || echo "account block: none in this build"
            prev=$(git describe --tags --abbrev=0 --match 'server-v*' "$GITHUB_SHA^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "Changes since $prev in the provider pins and migrations:"
              git diff --stat "$prev" "$GITHUB_SHA" -- server/core/oidc-providers.js server/db/migrations
            else
              echo "First server tag."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the functions bundle
        working-directory: server
        run: |
          node site/build.js
          cd dist && npm ci --omit=dev --ignore-scripts

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist
          retention-days: 30

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: server-production
    steps:
      - name: Deploy configuration and the migration gate
        id: cfg
        env:
          WTS_DEPLOY_TOKEN: ${{ secrets.WTS_DEPLOY_TOKEN }}
          WTS_DEPLOY_SITE: ${{ vars.WTS_DEPLOY_SITE }}
          WTS_DEPLOY_COMMAND: ${{ vars.WTS_DEPLOY_COMMAND }}
          PLATFORM_MIGRATIONS: ${{ needs.verify.outputs.platform_migrations }}
          MIGRATIONS_CHANGED: ${{ needs.verify.outputs.migrations_changed }}
        run: |
          if [ -z "$WTS_DEPLOY_TOKEN" ] || [ -z "$WTS_DEPLOY_SITE" ] || [ -z "$WTS_DEPLOY_COMMAND" ]; then echo "::notice::deploy not configured — skipped"; echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$PLATFORM_MIGRATIONS" != "in-sync" ]; then
            echo "::error::the generated platform migrations were not confirmed in sync with server/db/migrations (migrations changed since the previous server tag: $MIGRATIONS_CHANGED) — refusing to deploy"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (the pinned deploy tools only)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: server/ci/deploy-cli

      - name: Setup Node (the deploy CLI needs Node 22)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the deploy CLI (whole tree pinned by its lockfile, no install scripts)
        if: steps.cfg.outputs.configured == 'true'
        working-directory: server/ci/deploy-cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download the bundle into a repository layout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/rel/server

      - name: Deploy the functions-only site (manual approval)
        if: steps.cfg.outputs.configured == 'true'
        working-directory: ${{ runner.temp }}/rel/server
        env:
          WTS_DEPLOY_TOKEN: ${{ secrets.WTS_DEPLOY_TOKEN }}
          WTS_DEPLOY_SITE: ${{ vars.WTS_DEPLOY_SITE }}
          WTS_DEPLOY_COMMAND: ${{ vars.WTS_DEPLOY_COMMAND }}
        run: |
          # <temp>/rel is the repository root as the host's CLI sees it (base directory `server`); the bundle is server/
          git -C "$RUNNER_TEMP/rel" init -q
          test -f package.json && test -d node_modules
          bash -c "$WTS_DEPLOY_COMMAND"

      - name: Health check after the deploy
        env:
          WTS_HEALTH_URL: ${{ vars.WTS_HEALTH_URL }}
        run: |
          if [ -z "$WTS_HEALTH_URL" ]; then echo "::notice::health URL not configured — skipped"; exit 0; fi
          curl -fsS --max-time 20 "$WTS_HEALTH_URL" | tee /dev/stderr | grep -q '"ok":true'
