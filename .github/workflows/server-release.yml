name: Server release (accounts API — server-v* tags only)

# docs/ACCOUNTS-PLAN.md §13.8 / D19 (WP-OPS). The functions-only site in server/ is released ONLY from a server-v* tag on a
# master commit, never by an ordinary push (the static site keeps auto-deploying from master as before). The workflow is
# inert until the owner adds the secrets and variables below (server/RUNBOOK.md, "Activation checklist"):
#   environment server-migrations (required reviewer = the owner): secret WTS_MIGRATE_DB_URL
#   environment server-production (required reviewer = the owner): secret WTS_DEPLOY_TOKEN, variables WTS_DEPLOY_SITE,
#     WTS_DEPLOY_COMMAND (the host CLI deploy invocation, run inside server/dist) and optionally WTS_HEALTH_URL
# Without them the verify job still runs (tests, secret scan, publish check, account-block digest, bundle) and the migrate /
# deploy steps print a notice and skip. The request handlers' own secrets (master keys, peppers, provider secrets …) live
# only in the functions site's environment and never pass through this workflow.

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the master check and the pin diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag format and master ancestry
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^server-v[0-9]+(\.[0-9]+){0,2}$ ]]; then echo "::error::tag must be server-vN[.N[.N]]"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then echo "::error::the tagged commit is not on master"; exit 1; fi

      - name: Install server dependencies (pinned lockfile)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Server tests (throwaway local database cluster)
        working-directory: server
        env:
          WTS_TEST_DB_PORT: '54010'
        run: node test/run.js

      - name: Secret scan
        run: node server/ci/secret-scan.js

      - name: Publish allow-list check
        run: node prism-build/publish-site.js --check

      - name: Account block digest and pinned-file changes (for the owner's release checklist)
        run: |
          {
            echo "### Release checklist inputs for $GITHUB_REF_NAME"
            node prism-build/acct-hash.js --release || echo "account block: none in this build"
            prev=$(git describe --tags --abbrev=0 --match 'server-v*' "$GITHUB_SHA^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "Changes since $prev in the provider pins and migrations:"
              git diff --stat "$prev" "$GITHUB_SHA" -- server/core/oidc-providers.js server/db/migrations
            else
              echo "First server tag."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the functions bundle
        working-directory: server
        run: |
          node site/build.js
          cd dist && npm ci --omit=dev --ignore-scripts

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist
          retention-days: 30

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: server-migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply migrations (manual approval; expand-then-contract)
        working-directory: server
        env:
          WTS_MIGRATE_DB_URL: ${{ secrets.WTS_MIGRATE_DB_URL }}
        run: |
          if [ -z "$WTS_MIGRATE_DB_URL" ]; then echo "::notice::migration credential not configured — skipped"; exit 0; fi
          npm ci --ignore-scripts
          node db/migrate.js

  deploy:
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    environment: server-production
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: server/dist

      - name: Deploy the functions-only site (manual approval)
        working-directory: server/dist
        env:
          WTS_DEPLOY_TOKEN: ${{ secrets.WTS_DEPLOY_TOKEN }}
          WTS_DEPLOY_SITE: ${{ vars.WTS_DEPLOY_SITE }}
          WTS_DEPLOY_COMMAND: ${{ vars.WTS_DEPLOY_COMMAND }}
        run: |
          if [ -z "$WTS_DEPLOY_TOKEN" ] || [ -z "$WTS_DEPLOY_SITE" ] || [ -z "$WTS_DEPLOY_COMMAND" ]; then echo "::notice::deploy not configured — skipped"; exit 0; fi
          bash -c "$WTS_DEPLOY_COMMAND"

      - name: Health check after the deploy
        env:
          WTS_HEALTH_URL: ${{ vars.WTS_HEALTH_URL }}
        run: |
          if [ -z "$WTS_HEALTH_URL" ]; then echo "::notice::health URL not configured — skipped"; exit 0; fi
          curl -fsS --max-time 20 "$WTS_HEALTH_URL" | tee /dev/stderr | grep -q '"ok":true'
