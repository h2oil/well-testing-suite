name: Modbus bridge release

# Builds and tests the one-click installers of the WTS Modbus bridge and publishes them as a GitHub
# Release, so the app can link to
#   https://github.com/h2oil/well-testing-suite/releases/latest/download/WTS-Modbus-Bridge-Setup.exe
#   https://github.com/h2oil/well-testing-suite/releases/latest/download/wts-modbus-bridge-install.sh
#
# Cut a release (the tag must match BRIDGE_VERSION in tools/modbus-bridge/modbus-bridge.js):
#   git tag modbus-bridge-v1.2.2 && git push origin modbus-bridge-v1.2.2
# Code signing (Windows exe) — set ONE of these as repository secrets (Settings → Secrets and variables → Actions):
#   Azure Trusted Signing (recommended): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     TRUSTED_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net/), TRUSTED_SIGNING_ACCOUNT,
#     TRUSTED_SIGNING_PROFILE
#   or a code-signing certificate (.pfx from a CA, OV or EV): WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
# Without them the exe is built unsigned (a warning is shown). A published release refuses an
# unsigned exe unless the dispatch input allow_unsigned is ticked.
# workflow_dispatch builds and tests only (the assets are kept as workflow artifacts); dispatched on master
# with publish = true it also creates the modbus-bridge-v<BRIDGE_VERSION> tag and the release.

on:
  push:
    tags:
      - 'modbus-bridge-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release (tag modbus-bridge-v<BRIDGE_VERSION>; master only)'
        type: boolean
        default: false
      allow_unsigned:
        description: 'Allow publishing an unsigned exe (no signing secrets set)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modbus-bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Windows installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HAS_TRUSTED_SIGNING: ${{ secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/modbus-bridge-v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the tag matches the bridge version
        if: startsWith(github.ref, 'refs/tags/modbus-bridge-v')
        shell: bash
        run: |
          v="$(node -p "require('./tools/modbus-bridge/modbus-bridge.js').BRIDGE_VERSION")"
          test "modbus-bridge-v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match BRIDGE_VERSION $v"; exit 1; }

      - name: Build WTS-Modbus-Bridge-Setup.exe (Node SEA + postject, GUI subsystem)
        run: node tools/modbus-bridge/exe/build-exe.js --out dist

      - name: Sign the exe (Azure Trusted Signing)
        if: env.HAS_TRUSTED_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: WTS Modbus Bridge
          description-url: https://github.com/h2oil/well-testing-suite

      - name: Sign the exe (code-signing certificate .pfx)
        if: env.HAS_TRUSTED_SIGNING != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "WTS Modbus Bridge" /du "https://github.com/h2oil/well-testing-suite" dist\WTS-Modbus-Bridge-Setup.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { throw "signtool failed ($code)" }

      - name: Verify the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\WTS-Modbus-Bridge-Setup.exe
          Write-Host "Signature: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'Valid') { exit 0 }
          if ($env:HAS_TRUSTED_SIGNING -eq 'true' -or $env:HAS_PFX -eq 'true') { throw "the exe was signed but the signature is $($sig.Status)" }
          if ($env:PUBLISHING -eq 'true' -and $env:ALLOW_UNSIGNED -ne 'true') { throw 'refusing to publish an unsigned exe: set the signing secrets (see the top of this workflow) or tick allow_unsigned' }
          Write-Host '::warning::WTS-Modbus-Bridge-Setup.exe is NOT code-signed (no signing secrets set) — SmartScreen will warn users'

      - name: Smoke-test the exe (version, install --no-browser, /health, status page, Run key, single instance, settings, uninstall)
        run: node tools/modbus-bridge/exe/ci-smoke-exe.js dist/WTS-Modbus-Bridge-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WTS-Modbus-Bridge-Setup.exe
          if-no-files-found: error

  unix-scripts:
    name: macOS / Linux installer (.sh) + package (.zip)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build wts-modbus-bridge-install.sh and the package zip
        run: node tools/modbus-bridge/exe/build-release-scripts.js --out dist

      - name: bash -n
        run: bash -n dist/wts-modbus-bridge-install.sh

      - name: Test the release installer end to end (piped into bash, temp HOME, /health, auto-start, uninstall)
        run: node tools/modbus-bridge/exe/test-release-sh.js dist/wts-modbus-bridge-install.sh

      - name: Unit tests of the launcher, release scripts and installers
        run: |
          node prism-build/accept-test.js --file modbus-bridge-exe
          node prism-build/accept-test.js --file modbus-bridge-install

      - uses: actions/upload-artifact@v4
        with:
          name: unix-scripts
          path: |
            dist/wts-modbus-bridge-install.sh
            dist/wts-modbus-bridge-*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/modbus-bridge-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master')
    needs: [windows-exe, unix-scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="${GITHUB_REF_NAME}"; else t="modbus-bridge-v$(node -p "require('./src/tools/modbus-bridge/modbus-bridge.js').BRIDGE_VERSION")"; fi
          echo "name=$t" >> "$GITHUB_OUTPUT"
          echo "Release tag: $t"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum WTS-Modbus-Bridge-Setup.exe wts-modbus-bridge-install.sh wts-modbus-bridge-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update the release (marked latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: WTS Modbus Bridge ${{ steps.tag.outputs.name }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          body: |
            One-click installers of the WTS Modbus bridge (WebSocket to Modbus TCP) for the Well Testing Suite web app.

            **Windows:** download `WTS-Modbus-Bridge-Setup.exe` and double-click it. No administrator rights and no Node.js needed. It installs for the current user, starts the bridge now and at every login, and opens its status page. The exe is code-signed by H2Oil Engineering. While a new certificate builds reputation, SmartScreen may still say "Windows protected your PC" for a while: click **More info**, check the publisher, then **Run anyway**.

            **macOS / Linux:** in a Terminal run
            ```
            curl -fsSL https://github.com/h2oil/well-testing-suite/releases/latest/download/wts-modbus-bridge-install.sh | bash -s -- --autostart --yes
            ```
            (it needs Node.js 18 or newer and offers to install it with Homebrew or your package manager).

            Then press **Check bridge** on the Modbus Config page. The bridge listens on 127.0.0.1:8502 only, allows any device IP address by default and refuses Modbus writes unless you allow them.

            Checksums: `SHA256SUMS.txt`.
          files: |
            assets/WTS-Modbus-Bridge-Setup.exe
            assets/wts-modbus-bridge-install.sh
            assets/wts-modbus-bridge-*.zip
            assets/SHA256SUMS.txt
