    <script>(function () {
    /* iOS app only (runs before first paint): html.ios-app scopes the phone/tablet layout rules in
       ios-styles.css, and the bundled three.js URL is known before any page can open the 3D view.
       Keep code before this comment: sync-from-main.js anchors the capacitor.js tag on the first
       script element whose body starts with a comment, which must stay the main app script. */
    try {
        var C = window.Capacitor;
        if (location.protocol === 'capacitor:' || (C && typeof C.isNativePlatform === 'function' && C.isNativePlatform())) {
            document.documentElement.classList.add('ios-app');
        }
        window.WTS3D_LOCAL_URL = window.WTS3D_LOCAL_URL || 'three.module.min.js';
    } catch (e) {} })();
    </script>
